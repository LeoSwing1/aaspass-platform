name: aaspass_vendor
description: AasPass vendor mobile application.
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  http: ^1.6.0
